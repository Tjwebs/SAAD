<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Create Problem</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h2>Customer Dashboard</h2>
        <button onclick="logout()">Logout</button>
    </div>
    
    <div class="container">
        <h2>Submit New Complaint</h2>
        <p class="subtitle">Fill out the form below to submit your complaint</p>
        
        <div class="form-box">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Brief summary of your complaint (Max 50 chars)" maxlength="50">
            
            <label for="desc">Description</label>
            <textarea id="desc" placeholder="Please provide any other relevant details (Optional)"></textarea>
            
            <div class="error" id="error">
                <strong>Error</strong><br>
                <span id="error-message"></span>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="submitProblem()">Submit</button>
                <button class="btn-secondary" onclick="window.location.href='/dashboard'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = '/';
        }
        
        async function submitProblem() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const errorDiv = document.getElementById('error');
            const errorMsg = document.getElementById('error-message');
            
            errorDiv.style.display = 'none';
            
            if (!title) {
                errorDiv.style.display = 'block';
                errorMsg.textContent = 'Title is required';
                return;
            }
            
            
            try {
                const response = await fetch('http://127.0.0.1:5002/problems', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ title, desc })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.style.display = 'block';
                    errorMsg.textContent = data.error || 'Failed to create problem';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorMsg.textContent = 'Could not connect to server';
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
